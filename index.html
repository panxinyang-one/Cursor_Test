<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Test</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f4f7ff 0%, #e8eefc 100%);
      color: #1f2937;
    }

    main {
      width: min(560px, calc(100% - 32px));
      padding: 36px 32px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(31, 41, 55, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    p {
      margin: 0;
      line-height: 1.7;
      color: #4b5563;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">Cursor Test</div>
    <h1>你好，GitHub</h1>
    <p>这是一个用于测试提交的简单 HTML 页面。页面已创建并推送到仓库。</p>
  </main>
</body>
</html>
