<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <div class="logo">Cursor Test</div>
    <nav>
      <a href="#features">功能</a>
      <a href="#about">关于</a>
    </nav>
  </header>

  <section class="hero">
    <div class="badge reveal">Cursor Test</div>
    <h1 class="reveal delay-1">你好，GitHub</h1>
    <p class="reveal delay-2">这是一个用于测试提交的简单 HTML 页面。向下滚动看看渐入效果。</p>
    <a class="cta reveal delay-3" href="#features">看看下面</a>
  </section>

  <section id="features">
    <h2 class="reveal">页面里的小效果</h2>
    <p class="reveal delay-1">滚动时区块会渐入，离开视口后再渐出。卡片悬停会轻轻浮起。</p>
    <div class="cards">
      <article class="card reveal">
        <h3>滚动渐入</h3>
        <p>内容进入视口时淡入上移，离开后再淡出。</p>
      </article>
      <article class="card reveal delay-1">
        <h3>卡片悬停</h3>
        <p>鼠标移上去时卡片轻微抬起，阴影也会加深。</p>
      </article>
      <article class="card reveal delay-2">
        <h3>顶栏阴影</h3>
        <p>向下滚动后，顶部导航会多一层浅阴影。</p>
      </article>
    </div>
  </section>

  <section id="about">
    <h2 class="reveal">保持简单</h2>
    <p class="reveal delay-1">没有复杂动画，只加了常见页面里会用到的过渡效果，方便你继续测试提交流程。</p>
  </section>

  <footer class="reveal">页面已创建，等待你的下一步指示。</footer>

  <script src="script.js"></script>
</body>
</html>
